<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Migration Live Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #map { height: 600px; }
        .pulse {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Bird Migration Live Map</h1>
            <div class="flex items-center space-x-4">
                <label for="species-select" class="font-medium">Select Species:</label>
                <select id="species-select" class="bg-white text-gray-800 px-3 py-1 rounded shadow focus:outline-none">
                    <!-- Options populated dynamically -->
                </select>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4 bg-white rounded-lg shadow-xl">
        <div id="map" class="rounded-lg"></div>
        <div class="mt-4 p-4 bg-blue-50 border-l-4 border-blue-500 text-blue-700">
            <p class="font-bold">Legend</p>
            <ul class="list-disc ml-5">
                <li><span class="inline-block w-3 h-3 bg-blue-500 rounded-full"></span> Recent Sightings (US, Last 14 days)</li>
                <li><span class="inline-block w-3 h-3 bg-red-500 rounded-full"></span> Atlantic Flyway (Animated)</li>
            </ul>
        </div>
    </main>

    <footer class="container mx-auto mt-8 mb-8 text-center text-gray-500 text-sm">
        Data provided by eBird API | Built with Leaflet.js & Flask
    </footer>

    <script src="/static/js/map.js"></script>
</body>
</html>
