<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Spottings Live Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #map { height: 600px; }
        .pulse {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold">Bird Migration Live Map</h1>
            <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                <!-- Search Bar -->
                <div class="relative w-full md:w-64">
                    <input type="text" id="bird-search" placeholder="Search any bird species..." 
                           class="w-full bg-blue-700 text-white placeholder-blue-300 px-4 py-1.5 rounded-full border border-blue-500 focus:outline-none focus:ring-2 focus:ring-white text-sm">
                    <div id="search-results" class="absolute left-0 right-0 mt-2 bg-white rounded-lg shadow-xl border border-gray-200 hidden z-[2000] max-h-60 overflow-y-auto"></div>
                </div>

                <div class="flex items-center space-x-2 whitespace-nowrap">
                    <label for="species-select" class="font-medium text-sm">Active Species:</label>
                    <select id="species-select" class="bg-white text-gray-800 px-3 py-1 rounded shadow focus:outline-none text-sm min-w-[180px]">
                        <!-- Options populated dynamically -->
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- Controls Bar -->
    <div class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-[1000]">
        <div class="container mx-auto px-4 py-3 flex flex-col md:flex-row items-center gap-6">
            <!-- Region Select -->
            <div class="flex items-center space-x-2">
                <label for="region-select" class="text-sm font-semibold text-gray-700">Region:</label>
                <select id="region-select" class="text-sm border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="US">All US</option>
                    <option value="US-AL">Alabama</option>
                    <option value="US-AK">Alaska</option>
                    <option value="US-AZ">Arizona</option>
                    <option value="US-AR">Arkansas</option>
                    <option value="US-CA">California</option>
                    <option value="US-CO">Colorado</option>
                    <option value="US-CT">Connecticut</option>
                    <option value="US-DE">Delaware</option>
                    <option value="US-FL">Florida</option>
                    <option value="US-GA">Georgia</option>
                    <option value="US-HI">Hawaii</option>
                    <option value="US-ID">Idaho</option>
                    <option value="US-IL">Illinois</option>
                    <option value="US-IN">Indiana</option>
                    <option value="US-IA">Iowa</option>
                    <option value="US-KS">Kansas</option>
                    <option value="US-KY">Kentucky</option>
                    <option value="US-LA">Louisiana</option>
                    <option value="US-ME">Maine</option>
                    <option value="US-MD">Maryland</option>
                    <option value="US-MA">Massachusetts</option>
                    <option value="US-MI">Michigan</option>
                    <option value="US-MN">Minnesota</option>
                    <option value="US-MS">Mississippi</option>
                    <option value="US-MO">Missouri</option>
                    <option value="US-MT">Montana</option>
                    <option value="US-NE">Nebraska</option>
                    <option value="US-NV">Nevada</option>
                    <option value="US-NH">New Hampshire</option>
                    <option value="US-NJ">New Jersey</option>
                    <option value="US-NM">New Mexico</option>
                    <option value="US-NY">New York</option>
                    <option value="US-NC">North Carolina</option>
                    <option value="US-ND">North Dakota</option>
                    <option value="US-OH">Ohio</option>
                    <option value="US-OK">Oklahoma</option>
                    <option value="US-OR">Oregon</option>
                    <option value="US-PA">Pennsylvania</option>
                    <option value="US-RI">Rhode Island</option>
                    <option value="US-SC">South Carolina</option>
                    <option value="US-SD">South Dakota</option>
                    <option value="US-TN">Tennessee</option>
                    <option value="US-TX">Texas</option>
                    <option value="US-UT">Utah</option>
                    <option value="US-VT">Vermont</option>
                    <option value="US-VA">Virginia</option>
                    <option value="US-WA">Washington</option>
                    <option value="US-WV">West Virginia</option>
                    <option value="US-WI">Wisconsin</option>
                    <option value="US-WY">Wyoming</option>
                </select>
            </div>

            <!-- Days Slider -->
            <div class="flex items-center space-x-3 grow">
                <label for="days-slider" class="text-sm font-semibold text-gray-700 whitespace-nowrap">Timeframe:</label>
                <input type="range" id="days-slider" min="1" max="30" value="14" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                <span id="days-label" class="text-sm font-medium text-blue-600 min-w-[100px]">Last 14 days</span>
            </div>
        </div>
    </div>

    <main class="container mx-auto mt-8 p-4 bg-white rounded-lg shadow-xl">
        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Left Column: Map -->
            <div class="lg:w-2/3">
                <div id="map" class="rounded-lg shadow-inner"></div>
            </div>

            <!-- Right Column: Species Info Panel -->
            <div id="species-panel" class="lg:w-1/3 p-4 bg-gray-50 rounded-lg border border-gray-200 min-h-[400px]">
                <div id="species-info-content">
                    <div id="species-placeholder" class="text-center py-20 text-gray-400 italic">
                        Select a species to see info
                    </div>
                    
                    <div id="species-skeleton" class="hidden animate-pulse space-y-4">
                        <div class="w-full h-48 bg-gray-200 rounded-lg"></div>
                        <div class="h-6 bg-gray-200 rounded w-3/4"></div>
                        <div class="space-y-2">
                            <div class="h-4 bg-gray-200 rounded w-full"></div>
                            <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                        </div>
                    </div>

                    <div id="species-data" class="hidden space-y-4">
                        <img id="species-img" class="w-full h-auto rounded-lg shadow-md hidden" alt="Bird Image">
                        <h2 id="species-name" class="text-2xl font-bold text-blue-600 leading-tight"></h2>
                        <div id="species-desc" class="text-sm text-gray-600 leading-relaxed"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Flyway Toggles -->
        <div class="mt-4 flex flex-wrap gap-2">
            <button id="toggle-atlantic" class="px-3 py-1 rounded text-white text-sm font-medium transition-all ring-2 ring-offset-2 ring-gray-400" style="background-color: #ef4444;">Atlantic</button>
            <button id="toggle-mississippi" class="px-3 py-1 rounded text-white text-sm font-medium transition-all ring-2 ring-offset-2 ring-gray-400" style="background-color: #10b981;">Mississippi</button>
            <button id="toggle-central" class="px-3 py-1 rounded text-white text-sm font-medium transition-all ring-2 ring-offset-2 ring-gray-400" style="background-color: #f59e0b;">Central</button>
            <button id="toggle-pacific" class="px-3 py-1 rounded text-white text-sm font-medium transition-all ring-2 ring-offset-2 ring-gray-400" style="background-color: #8b5cf6;">Pacific</button>
        </div>

        <div class="mt-4 p-4 bg-blue-50 border-l-4 border-blue-500 text-blue-700">
            <div class="flex justify-between items-start">
                <p class="font-bold">Legend</p>
                <div id="fetch-status" class="text-sm font-medium"></div>
            </div>
            <ul class="list-disc ml-5">
                <li><span class="inline-block w-3 h-3 bg-blue-500 rounded-full"></span> Recent Sightings (US, Last 14 days)</li>
                <li><span class="inline-block w-3 h-3 rounded-full" style="background-color: #ef4444;"></span> Active Flyway Paths (Dashed)</li>
            </ul>
        </div>
    </main>

    <footer class="container mx-auto mt-8 mb-8 text-center text-gray-500 text-sm">
        Data provided by eBird API | Built with Leaflet.js & Flask
    </footer>

    <script src="/static/js/map.js"></script>
</body>
</html>
